# Publishes an abyme cell from your repository to abyme, as `hosted:<account>/<cell>`.
# Your repository calls it (README.md says how); abyme gives a push token only to a run of
# this workflow, from a repository an owner of the account trusts to publish its cells.
#
# A publish runs on your signed tag `v<version>`, the package's version. It builds the cell, commits
# the files `npm pack` would ship on `main` after the previous version, tags it `v<version>` (the
# source tag's message its notes, `Signed-by: <who pushed it>` last) and pushes. Versions never move.
# A yank tags `yanked/v<version>` on that version's commit and deletes nothing. A dry run builds and
# lists what would ship, and pushes nothing.
#
# The trade for a push token says what the version ships to a page (`page`) and its contract
# (`contract.json`), read off the built cell by publish-tools.mjs, a bundle of abyme's own rules
# (abyme's scripts/publish-tools). abyme refuses a public cell of an account other than abyme that
# ships page code, and a version that breaks what callers of the version before it send or read
# without a new major. The contract goes to the cell's `store` branch beside its inspection.
#
# It holds no secret: its one credential is the run's OIDC token (your job's `id-token: write`),
# which abyme trades for a push token to that one cell, for 10 minutes. Your code (install and
# build) runs in the job `build`, which cannot mint that token; the job `push` runs none of it.
name: publish
on:
  workflow_call:
    inputs:
      account:
        description: The abyme account the cell is published under (your handle, or your org's)
        type: string
        required: true
      cell:
        description: The cell's name in that account; left out, the package's `abyme.id`
        type: string
        required: false
      folder:
        description: The cell's folder, where its package.json is
        type: string
        default: "."
      action:
        description: publish, yank or dry-run
        type: string
        default: publish
      version:
        description: The version to yank (x.y.z); a publish takes the tag's
        type: string
        required: false
env:
  GATEWAY: auth.abyme.dev
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cell: ${{ steps.what.outputs.cell }}
      version: ${{ steps.what.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: What
        id: what
        env:
          ACCOUNT: ${{ inputs.account }}
          CELL: ${{ inputs.cell }}
          FOLDER: ${{ inputs.folder }}
          ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          case $ACTION in publish | yank | dry-run) ;; *) echo "action is publish, yank or dry-run, not $ACTION" >&2; exit 1 ;; esac
          echo "$ACCOUNT" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$' || { echo "$ACCOUNT is not an account's handle" >&2; exit 1; }
          test -f "$FOLDER/package.json" || { echo "$FOLDER has no package.json" >&2; exit 1; }
          id=$(node -p "require('./$FOLDER/package.json').abyme?.id ?? ''")
          version=$(node -p "require('./$FOLDER/package.json').version ?? ''")
          test -n "$id" || { echo "$FOLDER/package.json has no abyme.id: it is not a cell" >&2; exit 1; }
          CELL=${CELL:-$id}
          echo "$CELL" | grep -Eq '^[a-z0-9][a-z0-9-]{0,63}$' || { echo "$CELL is not a cell's name: lowercase letters, digits and -" >&2; exit 1; }
          if [ "$ACTION" = yank ]; then
            test -n "$VERSION" || { echo "a yank names its version" >&2; exit 1; }
          else
            VERSION=$version
            if [ "$ACTION" = publish ]; then
              [ "$GITHUB_REF_TYPE" = tag ] || { echo "a publish runs on a tag v<version>, not $GITHUB_REF_NAME" >&2; exit 1; }
              [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "the tag is $GITHUB_REF_NAME, but $FOLDER/package.json says version $version" >&2; exit 1; }
            fi
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "$VERSION is not a version x.y.z" >&2; exit 1; }
          { echo "cell=$(echo "$ACCOUNT" | tr '[:upper:]' '[:lower:]')/$CELL"; echo "version=$VERSION"; } >>"$GITHUB_OUTPUT"
      - name: Build
        if: inputs.action != 'yank'
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          set -eu
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            (cd "$FOLDER" && pnpm run --if-present build)
          elif [ -f package-lock.json ]; then
            npm ci
            (cd "$FOLDER" && npm run --if-present build)
          else
            echo "no pnpm-lock.yaml or package-lock.json: a publish builds from a lockfile" >&2
            exit 1
          fi
      - name: The files it ships
        if: inputs.action != 'yank'
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          (cd "$FOLDER" && npm pack --dry-run --json) | node -e 'for (const f of JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files) console.log(f.path)' >"$RUNNER_TEMP/files"
          cat "$RUNNER_TEMP/files"
          mkdir -p "$RUNNER_TEMP/ship"
          while IFS= read -r f; do mkdir -p "$RUNNER_TEMP/ship/$(dirname "$f")"; cp "$FOLDER/$f" "$RUNNER_TEMP/ship/$f"; done <"$RUNNER_TEMP/files"
      # abyme's rules of page code and of a contract, as this workflow's own tag carries them.
      - uses: actions/checkout@v4
        if: inputs.action != 'yank'
        with:
          repository: abyme-studio/publish
          ref: v1
          path: .abyme-publish
          persist-credentials: false
      - name: What it ships to a page, and its contract
        if: inputs.action != 'yank'
        run: |
          set -euo pipefail
          # It runs the cell's built halves against stand-ins, here, where its code already ran.
          node .abyme-publish/publish-tools.mjs "$RUNNER_TEMP/ship" >"$RUNNER_TEMP/said.json"
          mkdir -p "$RUNNER_TEMP/trade"
          jq -c .page "$RUNNER_TEMP/said.json" >"$RUNNER_TEMP/trade/page.json"
          jq .contract "$RUNNER_TEMP/said.json" >"$RUNNER_TEMP/trade/contract.json"
          echo "page code: $(cat "$RUNNER_TEMP/trade/page.json")"
      - uses: actions/upload-artifact@v4
        if: inputs.action == 'publish'
        with:
          name: trade
          path: ${{ runner.temp }}/trade
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.action == 'publish'
        with:
          name: cell
          path: ${{ runner.temp }}/ship
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
  push:
    needs: build
    if: inputs.action != 'dry-run'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        if: inputs.action == 'publish'
        with:
          name: cell
          path: ${{ runner.temp }}/ship
      - uses: actions/download-artifact@v4
        if: inputs.action == 'publish'
        with:
          name: trade
          path: ${{ runner.temp }}/trade
      # A publish is signed: the tag is annotated, and GitHub verifies its signature against the
      # tagger's keys. Who pushed it is the version's signer, `Signed-by: <login>`, its last line.
      - name: The tag is signed
        if: inputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          unsigned() { echo "$GITHUB_REF_NAME is not a signed tag${1:+: $1}" >&2; exit 1; }
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          [ "$(printf %s "$ref" | jq -r .object.type)" = tag ] || unsigned "a lightweight tag"
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(printf %s "$ref" | jq -r .object.sha)")
          [ "$(printf %s "$tag" | jq -r .verification.verified)" = true ] || unsigned "$(printf %s "$tag" | jq -r .verification.reason)"
          # The tag still names the commit this run built: never one swapped in since.
          [ "$(printf %s "$tag" | jq -r .object.sha)" = "$GITHUB_SHA" ] || unsigned "it names $(printf %s "$tag" | jq -r .object.sha), not $GITHUB_SHA, which this run built"
          { printf %s "$tag" | jq -r .message | sed -e '/^-----BEGIN /,$d'; printf '\nSigned-by: %s\n' "$GITHUB_ACTOR"; } >"$RUNNER_TEMP/notes"
      # The run's OIDC token, its audience auth.abyme.dev, traded for a push token to this one cell.
      # A publish's trade says its version, what it ships to a page and its contract; a yank's, the cell alone.
      - name: A push token
        id: token
        env:
          ACTION: ${{ inputs.action }}
          CELL: ${{ needs.build.outputs.cell }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || { echo "no OIDC token: the calling job needs permissions id-token: write" >&2; exit 1; }
          oidc=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$GATEWAY" | jq -r .value)
          echo "::add-mask::$oidc"
          if [ "$ACTION" = publish ]; then
            jq -n --arg cell "$CELL" --arg version "$VERSION" --slurpfile page "$RUNNER_TEMP/trade/page.json" --slurpfile contract "$RUNNER_TEMP/trade/contract.json" \
              '{cell: $cell, version: $version, page: $page[0], contract: $contract[0]}' >"$RUNNER_TEMP/trade.json"
          else
            jq -n --arg cell "$CELL" '{cell: $cell}' >"$RUNNER_TEMP/trade.json"
          fi
          answer=$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $oidc" -H "content-type: application/json" \
            -d @"$RUNNER_TEMP/trade.json" "https://$GATEWAY/gateway/cells/publish")
          code=$(printf %s "$answer" | tail -n1)
          body=$(printf %s "$answer" | sed '$d')
          if [ "$code" != 200 ]; then
            echo "$GATEWAY refused the publish ($code): $(printf %s "$body" | jq -r '.message // .error // .' 2>/dev/null || printf %s "$body")" >&2
            exit 1
          fi
          token=$(printf %s "$body" | jq -r .token)
          echo "::add-mask::$token"
          echo "url=$(printf %s "$body" | jq -r .url)" >>"$GITHUB_OUTPUT"
          echo "token=$token" >>"$GITHUB_OUTPUT"
      - name: Push
        env:
          ACTION: ${{ inputs.action }}
          CELL: ${{ needs.build.outputs.cell }}
          VERSION: ${{ needs.build.outputs.version }}
          REMOTE: ${{ steps.token.outputs.url }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # What `build` handed over is files alone: no git folder, no link, and no hook ever runs.
          if [ "$ACTION" = publish ]; then
            [ -z "$(find "$RUNNER_TEMP/ship" -name .git -print -quit)" ] || { echo "the build handed over a .git: a cell ships files alone" >&2; exit 1; }
            [ -z "$(find "$RUNNER_TEMP/ship" -type l -print -quit)" ] || { echo "the build handed over a symlink: a cell ships files alone" >&2; exit 1; }
          fi
          git config --global core.hooksPath /dev/null
          git config --global user.name "abyme publish"
          git config --global user.email "publish@abyme.dev"
          git config --global "http.$REMOTE.extraHeader" "Authorization: Bearer $TOKEN"
          # The cell host takes a push over protocol v1 only.
          git config --global protocol.version 1
          repo=$RUNNER_TEMP/repo
          git clone --quiet "$REMOTE" "$repo"
          if git -C "$repo" rev-parse --verify --quiet "refs/tags/v$VERSION" >/dev/null; then
            [ "$ACTION" = yank ] || { echo "$CELL $VERSION is published; versions never move: bump version first" >&2; exit 1; }
          else
            [ "$ACTION" = publish ] || { echo "$CELL has no version $VERSION to yank" >&2; exit 1; }
          fi
          if [ "$ACTION" = yank ]; then
            git -C "$repo" tag -a "yanked/v$VERSION" -m "Yanked-by: $GITHUB_ACTOR" "v$VERSION^{commit}"
            git -C "$repo" push --quiet origin "yanked/v$VERSION"
            echo "yanked $CELL $VERSION"
            exit 0
          fi
          # The new tree is the package's files alone, on main after the previous version.
          git -C "$repo" checkout --quiet -B main
          git -C "$repo" rm -rq --ignore-unmatch .
          cp -R "$RUNNER_TEMP/ship/." "$repo/"
          git -C "$repo" add -A
          git -C "$repo" commit --quiet --allow-empty -m "$CELL $VERSION" -m "From $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          git -C "$repo" tag -a "v$VERSION" -F "$RUNNER_TEMP/notes"
          # Its contract on `store`, beside the inspection abyme's CI writes, for the next version's diff.
          git -C "$repo" fetch --quiet origin store:store 2>/dev/null || true
          store=$RUNNER_TEMP/store
          if git -C "$repo" rev-parse --verify --quiet store >/dev/null; then
            git -C "$repo" worktree add --quiet "$store" store
          else
            git -C "$repo" worktree add --quiet --orphan -b store "$store"
          fi
          mkdir -p "$store/v$VERSION"
          cp "$RUNNER_TEMP/trade/contract.json" "$store/v$VERSION/contract.json"
          git -C "$store" add "v$VERSION/contract.json"
          git -C "$store" commit --quiet -m "$CELL $VERSION: contract"
          git -C "$repo" push --quiet origin main "v$VERSION" store
          echo "published $CELL $VERSION: hosted:$CELL#^$VERSION"
